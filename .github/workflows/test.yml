name: Test
on:
  pull_request:
  push:
    branches:
    - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: Create environment
      run: uv sync --dev --all-extras
    - name: Verify exact SGB revision
      if: runner.os == 'Linux'
      run: >-
        uv run python -c "import importlib.metadata as m,json; p=json.loads(m.distribution('semantic-geometry-builder').read_text('direct_url.json')); assert p['vcs_info']['commit_id']=='f3fd898d6e4eaf31595c9aaca6a0658f0cb7f3b1'; print(p['vcs_info']['commit_id'])"
    - name: Run tests
      run: uv run pytest
  test_coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repo
      uses: actions/checkout@v6
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libegl1 libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
    - name: Install UV
      uses: astral-sh/setup-uv@v6
    - name: Install Just
      uses: taiki-e/install-action@just
    - name: Create environment
      run: uv sync --dev --all-extras
    - name: Run tests with coverage
      run: just cov
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
